name: android
on:
  push:
    branches: [main]
    paths: ["apps/android/**", "crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", "crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".github/workflows/android.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native build tools
        run: |
          sdkmanager 'ndk;29.0.14206865' 'build-tools;37.0.0' 'platforms;android-37.2'
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Generate playback fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p apps/android/app/build/playback-fixtures
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=24 -f lavfi -i sine=frequency=440 -t 8 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart apps/android/app/build/playback-fixtures/video.mp4
      - name: Build and check Android
        working-directory: apps/android
        run: bash gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Local native device checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd apps/android && bash gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=net.anibel.app.LocalCoreLifecycleTest,net.anibel.app.LocalPlaybackTest
