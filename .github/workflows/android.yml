name: android
on:
  push:
    branches: [main]
    tags: ["android-v*"]
    paths: ["apps/android/**", "crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "scripts/package-android.py", "scripts/create-android-update-fixtures.py", "scripts/test_android_release.py", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", "crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "scripts/package-android.py", "scripts/create-android-update-fixtures.py", "scripts/test_android_release.py", ".github/workflows/android.yml"]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release packaging rules
        run: python -m unittest discover -s scripts -p test_android_release.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native build tools
        run: |
          sdkmanager 'ndk;29.0.14206865' 'build-tools;37.0.0' 'platforms;android-37.2'
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Generate playback fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p apps/android/app/build/playback-fixtures
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x180:rate=24 -f lavfi -i sine=frequency=440 -t 8 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart apps/android/app/build/playback-fixtures/video.mp4
      - name: Build and check Android
        working-directory: apps/android
        run: bash gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :app:assembleRelease :app:lintRelease
      - name: Build local device tests
        working-directory: apps/android
        run: bash gradlew :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Local native device checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd apps/android && bash gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=net.anibel.app.LocalCoreLifecycleTest,net.anibel.app.LocalPlaybackTest,net.anibel.app.AndroidUpdateTest
      - name: Save checked release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-release
          path: apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;37.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: android-unsigned-release
          path: artifacts/android-input
      - name: Read published release history
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp > "$RUNNER_TEMP/android-previous-releases.json"
      - name: Sign and verify release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          python scripts/package-android.py
          --apk artifacts/android-input/app-release-unsigned.apk
          --output artifacts/android-release
          --tag "$GITHUB_REF_NAME"
          --repository "$GITHUB_REPOSITORY"
          --previous-releases "$RUNNER_TEMP/android-previous-releases.json"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=()
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then extra+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" artifacts/android-release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --latest=false \
            --title "Anibel.Net ${GITHUB_REF_NAME#android-v} — Android" \
            --notes "Signed APK for phones, tablets, and Android TV. Install the APK over the previous release to update. Android asks for approval. Keep the app installed to keep its data." "${extra[@]}"
