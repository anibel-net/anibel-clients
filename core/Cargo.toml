[package]
name = "anibel-core"
version.workspace = true
edition.workspace = true

[lib]
name = "anibel_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
anibel-api = { path = "../crates/anibel-api" }
anibel-domain = { path = "../crates/anibel-domain" }
anibel-player = { path = "../crates/anibel-player" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "gzip", "stream"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[dev-dependencies]
httpmock = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
