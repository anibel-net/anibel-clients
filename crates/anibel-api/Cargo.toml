[package]
name = "anibel-api"
version.workspace = true
edition.workspace = true

[dependencies]
anibel-domain = { path = "../anibel-domain" }
graphql_client = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "gzip", "cookies", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
