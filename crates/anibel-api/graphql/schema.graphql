}

input FavoriteInput {
  mediaId: String!
  mediaType: MediaTypes!
}

input MarkAsInput {
  mediaId: String!
  mediaType: MediaTypes!
  status: MarkStatus!
}

enum MarkStatus {
  notselected
  watching
  watched
  dropped
  planned
  played
  read
  reading
  playing
}

type Mutation {
  createUser(email: String!, username: String!, password: String!): User
  updateUser(input: ProfileInput): Profile
  removeUser(id: String!): StatusRemoval
  addFavorite(input: FavoriteInput!): Media
  markAs(input: MarkAsInput!): StatusRemoval
  removeMark(input: MarkAsInput!): StatusRemoval
  removeFavorite(input: FavoriteInput!): StatusRemoval
  login(username: String!, password: String!): User
  oauth(type: OauthType!): String
  verifyOauth(type: OauthType!, payload: OauthPayload!): User
  upload(file: Upload!, type: UploadType!): File!
  uploadMany(files: [UplaodMany!]!): [File!]!
  addEpisode(input: AddEpisodeInput!): Episode
  addHistoryRecord(input: HistoryRecordInput!): OperationStatus
  removeHistoryRecord(input: HistoryRecordInput!): OperationStatus
  editEpisode(input: EditEpisodeInput!): Episode
  removeEpisode(id: String!): OperationStatus
  addMedia(input: AddMediaInput!): Media
  editMedia(input: EditMediaInput!): Media
  removeMedia(mediaId: String!): OperationStatus
  addChapter(input: AddChapterInput!): Chapter
  editChapter(input: EditChapterInput!): Chapter
  removeChapter(id: String!): OperationStatus
  addVolume(input: AddVolumeInput!): Volume
  editVolume(input: EditVolumeInput!): Volume
  removeVolume(id: String!): OperationStatus
  addSlide(input: SliderInput!): Slide!
  editSlide(input: EditSliderInput!): Slide!
  addRating(rating: Float, mediaType: MediaTypes, mediaId: String): RatingStatus!
  removeSlide(id: String): SlideRemoved!
  mediaReport(mediaType: MediaTypes!, mediaId: String!, videoType: ReportVideoType, connections: [Int], errorType: ReportErrors, message: String): Report
  report(message: String!): Report
  addComment(input: AddCommentInput!): Comment
  editComment(input: EditCommentInput!): Comment
  removeComment(id: String!): CommentRemoved
}

