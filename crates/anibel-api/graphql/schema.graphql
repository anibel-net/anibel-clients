type Profile {
  id: String!
  username: String!
  email: String
  role: String!
  social: Social
  displayName: String
  avatar: String
  wallpaper: String
  bio: String
  language: String
  oauth: Oauth
  verification: Verification
  favorites: [Media]
  status: Status
  marks: [ProfileMark]
}

input SocialInput {
  vk: String
  tg: String
}

input ProfileInput {
  id: String!
  social: SocialInput
  wallpaper: String
