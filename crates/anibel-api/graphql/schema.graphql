enum MediaTypes {
  anime
  manga
  cinema
  games
  books
}

enum StatusRemoval {
  SUCCESS
  ERROR
}

type Query {
  user(username: String!): Profile
  favorites(username: String!, mediaType: MediaTypes, offset: Int!, limit: Int!): FavoritePagination
  marks(username: String!, mediaType: MediaTypes, offset: Int!, limit: Int!): MarksPagination
  users(offset: Int!, limit: Int!, query: String, role: String): UsersPagination!
  status(username: String!, mediaType: MediaTypes!): Status!
  uploads: [File]
  media(slug: String!, mediaType: MediaTypes): Media
  getMediaList(offset: Int!, limit: Int!, mediaType: MediaTypes!, filters: MediaFilters): MediaPagination
  episodes(mediaId: String!, type: String!, resource: Int!, offset: Int, limit: Int): EpisodePagination
  chapters(mediaId: String!, offset: Int, limit: Int): ChapterPagination
  volumes(mediaId: String!, offset: Int, limit: Int): VolumesPagination
  volume(mediaId: String!, volume: Int): Volume
  chapter(slug: String!, chapter: Float!): Chapter
  randomMedia: Media
  search(query: String!, limit: Int): [Media]!
  getUpdatesList(offset: Int!, limit: Int!, type: UpdateType): UpdateDto!
  getRecommendations(type: RecommendationTypes!, limit: Int): [Media]!
  getSchedule: [Schedule]!
  getTrends(type: RecommendationTypes!, date: TrendDates!, limit: Int): [Media]!
  getSlider(offset: Int!, limit: Int!, query: String): [Slide]!
  getFilters(mediaType: MediaTypes, all: Boolean): Filters
  getStatistics: Statistics
  getStatisticsHistory(offset: Int!, limit: Int!): StatisticsPagination!
  reports(offset: Int!, limit: Int!, query: String, type: ReportType, closed: Boolean): ReportPagination!
  comments(mediaType: MediaTypes!, mediaId: String!, limit: Int!, offset: Int!): commentsPagination
  latestComments(limit: Int!, offset: Int!, query: String): commentsPagination
}





type FavoritePagination {
